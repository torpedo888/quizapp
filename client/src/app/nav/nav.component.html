<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Frank Quiz</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" 
                    aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarCollapse">
          <ul class="navbar-nav me-auto mb-2 mb-md-0">
            <li class="nav-item">
              <a class="nav-link active" routerLink="/quiz" routerLinkActive="active" aria-current="page" href="#">Quiz</a>
            </li>
            @if(this.accountService.currentUser()){
              <li *appHasRole="['Admin']" class="nav-item">
                <a routerLink="/admin" routerLinkActive="active" class="nav-link" aria-current="page" href="#">Admin</a>
              </li>
              <li *appHasRole="['Moderator']" class="nav-item">
                <a class="nav-link" routerLink="/edit-categories" href="#">Edit Categories</a>
              </li>
              <li *appHasRole="['Moderator']" class="nav-item">
                <a class="nav-link" routerLink="/quiz-edit" href="#">Edit Quizes</a>
              </li>
              <li *appHasRole="['Moderator']" class="nav-item">
                <a class="nav-link" routerLink="/question-list-edit" href="#">Question list edit</a>
              </li>

              <li *appHasRole="['Admin']" class="nav-item" >
                <a class="nav-link" routerLink="/upload-quiz" href="#">Upload Quiz</a>
              </li>
              
              <li class="nav-item">
                <a class="nav-link" (click)="logout()" aria-disabled="true">Logout</a>
              </li>

              
          }
          </ul>

        @if(this.accountService.currentUser()){
          <div dropdown class="dropdown">
            <a dropdownToggle class="dropdown-toggle text-light text-decoration-none">
              Welcome {{this.accountService.currentUser()?.username | titlecase}} 
            </a>
            <div *dropdownMenu class="dropdown-menu">
              <a class="dropdown-item">Edit profile</a>
              <a class="dropdown-item" (click)="logout()">Logout</a>
            </div>
          </div>
          
        }

        <!-- Right-side login toggle -->
        <div *ngIf="!accountService.currentUser()" class="d-flex align-items-center">
          <button class="btn btn-outline-light d-flex align-items-center" (click)="toggleLoginForm()">
            <span>Login</span>
            <i class="fa ms-2" [ngClass]="showLoginForm ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div *ngIf="showLoginForm"
     class="bg-light p-3 mt-2 rounded shadow w-100 w-md-auto"
     [ngClass]="{'position-absolute end-0 me-2': isDesktopView}"
     style="z-index: 1050; top: 60px; min-width: 280px; max-width: 400px; width: 100%;">
  
  <form #loginForm="ngForm" (ngSubmit)="login()" class="d-flex flex-column gap-2" autocomplete="off">
    <input name="username"
           [(ngModel)]="model.username"
           class="form-control"
           placeholder="Username">
    <input name="password"
           [(ngModel)]="model.password"
           class="form-control"
           type="password"
           placeholder="Password">
    <button class="btn btn-success mt-2" type="submit">Login</button>
  </form>

  <!-- Create Account Button -->
  <div class="text-center mt-2">
    <button class="btn btn-outline-primary btn-sm w-100" (click)="navigateToRegister()">Create Account</button>
  </div>
</div>
