<div class="container mt-4">
    <h2>Questions</h2>

    <div class="mb-3">
      <label for="quizSelect" class="form-label">Select Quiz</label>
      <select id="quizSelect" class="form-select" [(ngModel)]="selectedQuizId" (change)="onQuizSelected()">
        <option [ngValue]="null" disabled selected>Select a quiz</option>
        <option *ngFor="let quiz of quizzes" [ngValue]="quiz.id">{{ quiz.title }}</option>
      </select>
    </div>
  
    <button class="btn btn-danger float-end mb-2" [disabled]="!selectedQuizId" (click)="openAddModal()">
      <i class="bi bi-plus-lg"></i> Add Question
    </button>
  
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Text</th>
          <th>Image</th>
          <!-- <th>Quiz</th> -->
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let question of questions">
          <td>{{ question.text }}</td>
          <td>
            <img *ngIf="question.imageUrl" [src]="question.imageUrl" alt="Question Image" style="max-width: 80px; max-height: 80px;">
          </td>
          <!-- <td>{{ getQuizTitle(question.quizId) }}</td> -->
          <td>
            <div class="d-flex gap-2">
              <button class="btn btn-warning me-2" (click)="editQuestion(question)">Edit</button>
              <button class="btn btn-outline-danger" (click)="deleteQuestion(question.id)">Delete</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- Modal -->
  <div class="modal fade" tabindex="-1" [ngClass]="{'show d-block': showModal}" style="background: rgba(0,0,0,0.5);" *ngIf="showModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form [formGroup]="questionForm" (ngSubmit)="saveQuestion()">
          <div class="modal-header">
            <h5 class="modal-title">{{ isEditMode ? 'Edit' : 'Add' }} Question</h5>
            <button type="button" class="btn-close" (click)="closeModal()"></button>
          </div>
          <div class="modal-body">
            <!-- Form Fields -->
            <div class="mb-3">
              <label class="form-label">Text</label>
              <input formControlName="text" class="form-control" />
            </div>
           
            <!-- <div class="mb-3">
              <label class="form-label">Upload Image</label>
              <input type="file" class="form-control" (change)="onFileSelected($event)">
            </div> -->

            <div class="mb-3">
              <!-- Upload new image -->
              <label class="form-label">Upload New Image</label>
              <div class="input-group mb-2">
                <input type="file" class="form-control" (change)="onFileSelected($event)">
              </div>

              <div *ngIf="questionForm.get('imageUrl')?.value">
                <img [src]="questionForm.get('imageUrl')?.value" class="img-thumbnail" style="max-width: 150px;">
                <button type="button" class="btn btn-danger btn-sm ms-2" (click)="removeImage()">Delete Image</button>
              </div>
            
              <!-- Button to show/hide cloud selector -->
              <button class="btn btn-outline-primary mb-2" type="button" (click)="showImageSelector = !showImageSelector">
                {{ showImageSelector ? 'Hide Cloud Images' : 'Select from Cloud Images' }}
              </button>
            
              <!-- Cloud image selector component (toggle visible) -->
              <div *ngIf="showImageSelector" class="mt-3 border rounded p-3 bg-light">
                <app-quiz-image-selector (imageSelected)="onExistingImageSelected($event)"></app-quiz-image-selector>
                <button class="btn btn-secondary mt-2" (click)="showImageSelector = false">Close</button>
              </div>
            
              <!-- Image preview -->
              <!-- <div *ngIf="category.editedImageUrl" class="mt-3">
                <label class="form-label">Selected Image Preview:</label><br>
                <img [src]="category.editedImageUrl" alt="Selected" class="img-thumbnail" style="max-width: 200px;">
              </div> -->
            </div>


            <div class="mb-3">
                <label class="form-label">Options</label>
                <div *ngFor="let option of options.controls; let i = index" [formGroup]="option" class="input-group mb-2">
                    <input formControlName="text" class="form-control" placeholder="Option text" />
                    
                    <div class="form-check ms-2">
                        <input type="checkbox" formControlName="isCorrect" class="form-check-input" />
                        <label class="form-check-label">Correct</label>
                      </div>

                    <button type="button" class="btn btn-outline-danger" (click)="removeOption(i)" *ngIf="options.length > 1">
                      &times;
                    </button>
                  </div>
                  
                <button type="button" class="btn btn-sm btn-outline-primary" (click)="addOption()">Add Option</button>
              </div>
              
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">{{ isEditMode ? 'Update' : 'Save' }}</button>
            <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
