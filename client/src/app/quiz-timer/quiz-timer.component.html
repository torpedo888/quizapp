<div class="quiz-timer-info">
  <div class="timer-stat">
    <span class="stat-label">Time left</span>
    <div class="time-value"><strong class="timer-circle">{{ timeLeft }}</strong><span class="points">+{{ pointsPerQuestion }}</span></div>
  </div>
  <div class="progress-stat"><span class="stat-label">Question</span><strong>{{ currentQuestion }} / {{ totalQuestions }}</strong></div>
  <div class="score-stat"><span class="stat-label">Score</span><strong>{{ score }}</strong></div>
</div>
