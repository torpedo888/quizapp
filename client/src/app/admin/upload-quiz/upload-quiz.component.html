<div class="container mt-4">
  <h2 class="mb-3">Upload Quiz JSON</h2>

  <div class="mb-3">
    <label for="jsonFile" class="form-label">Select JSON file</label>
    <input
      type="file"
      class="form-control"
      id="jsonFile"
      (change)="onFileSelected($event)"
      accept=".json"
    />
  </div>

  <button
    class="btn btn-primary"
    (click)="upload()"
    [disabled]="!quizJson"
  >
    Upload
  </button>

  <div *ngIf="uploadResult" class="mt-3 alert alert-info">
    {{ uploadResult }}
  </div>
</div>
