<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>Categories</h4>
  <button class="btn btn-primary" (click)="addNewCategory()">
    ➕ Add Category
  </button>
</div>

<table class="table table-bordered table-striped">
  <thead>
    <tr>
      <th>Image</th>
      <th>Category Name</th>
      <th>Language</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <!-- New Category Row -->
    <tr *ngIf="newCategory">
      <td>
        <img *ngIf="newCategory.imageUrl" [src]="newCategory.imageUrl" alt="Preview" class="img-thumbnail preview-img" />
      </td>
      <td>
        <input type="text" [(ngModel)]="newCategory.name" class="form-control" placeholder="Enter category name" />
        <input type="file" (change)="onNewFileSelected($event)" class="form-control mt-2" />
          <!-- Button to show/hide cloud selector -->
          <button class="btn btn-outline-primary mb-2" type="button" (click)="showImageSelector = !showImageSelector">
            {{ showImageSelector ? 'Hide Cloud Images' : 'Select from Cloud Images' }}
          </button>
        
          <!-- Cloud image selector component (toggle visible) -->
          <div *ngIf="showImageSelector" class="mt-3 border rounded p-3 bg-light">
            <app-quiz-image-selector (imageSelected)="onExistingImageSelectedForNewCategory($event)"></app-quiz-image-selector>
            <button class="btn btn-secondary mt-2" (click)="showImageSelector = false">Close</button>
          </div>
        <!-- Language Selector Dropdown -->
        <div class="dropdown mt-2">
          <button
            class="btn btn-outline-secondary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">
            {{ newCategory.language || 'Select Language' }}
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" (click)="selectLanguage('en', $event)">English</a></li>
            <li><a class="dropdown-item" href="#" (click)="selectLanguage('hu', $event)">Magyar</a></li>
          </ul>
        </div>
      </td>
      <td>
        <span class="badge bg-secondary">New</span>
      </td>
      <td>
        <div class="d-flex gap-2">
          <button class="btn btn-success btn-sm" (click)="saveNewCategory()">Save</button>
          <button class="btn btn-secondary btn-sm" (click)="cancelNewCategory()">Cancel</button>
        </div>
      </td>
    </tr>
    
    <tr *ngFor="let category of categories">
      <!-- Display Thumbnail Image -->
      <td>
        <img 
          *ngIf="category.imageUrl" 
          [src]="category.imageUrl" 
          alt="Category Image" 
          class="img-thumbnail preview-img"
        />
      </td>
      
      <!-- Editable Category Name -->
      <td>
        <span *ngIf="!category.editing">{{ category.name }}</span>
        <input
          *ngIf="category.editing"
          [(ngModel)]="category.editedName"
          class="form-control"
        />

        <div *ngIf="category.editing" class="mb-3">
          <!-- Upload new image -->
          <label class="form-label">Upload New Image</label>
          <div class="input-group mb-2">
            <input type="file" class="form-control" (change)="onFileSelected($event, category)">
          </div>
        
          <!-- Button to show/hide cloud selector -->
          <button class="btn btn-outline-primary mb-2" type="button" (click)="showImageSelector = !showImageSelector">
            {{ showImageSelector ? 'Hide Cloud Images' : 'Select from Cloud Images' }}
          </button>
        
          <!-- Cloud image selector component (toggle visible) -->
          <div *ngIf="showImageSelector" class="mt-3 border rounded p-3 bg-light">
            <app-quiz-image-selector (imageSelected)="onExistingImageSelected($event, category)"></app-quiz-image-selector>
            <button class="btn btn-secondary mt-2" (click)="showImageSelector = false">Close</button>
          </div>
        
          <!-- Image preview -->
          <div *ngIf="category.editedImageUrl" class="mt-3">
            <label class="form-label">Selected Image Preview:</label><br>
            <img [src]="category.editedImageUrl" alt="Selected" class="img-thumbnail" style="max-width: 200px;">
          </div>
        </div>
      </td>
      <td>
       {{ category.languageShortName }} 
      </td>

      <!-- Status -->
      <td [ngClass]="{'bg-success text-white': category.isActive, 'bg-danger text-white': !category.isActive}">
        {{ category.isActive ? 'Active' : 'Inactive' }}
      </td>

      <!-- Actions -->
      <td>
        <div class="d-flex gap-2">
          <!-- Edit Button -->
          <button *ngIf="!category.editing" (click)="editCategory(category)" class="btn btn-warning btn-sm flex-grow-1" style="min-width: 90px;">
            Edit
          </button>
          <button *ngIf="category.editing" (click)="saveCategory(category)" class="btn btn-success btn-sm flex-grow-1" style="min-width: 90px;">
            Save
          </button>
          <button *ngIf="category.editing" (click)="cancelEdit(category)" class="btn btn-secondary btn-sm flex-grow-1" style="min-width: 90px;">
            Cancel
          </button>
      
          <!-- Activate/Deactivate Buttons -->
          <button *ngIf="!category.isActive" class="btn btn-success btn-sm flex-grow-1" (click)="activateCategory(category.id)" style="min-width: 90px;">
            Activate
          </button>
          <button *ngIf="category.isActive" class="btn btn-danger btn-sm flex-grow-1" (click)="deactivateCategory(category.id)" style="min-width: 90px;">
            Deactivate
          </button>
          <button class="btn btn-outline-danger" (click)="deleteCategory(category.id)">Delete</button>
        </div>
      </td>
      
      
      
      
    </tr>
  </tbody>
</table>
