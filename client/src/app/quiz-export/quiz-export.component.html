<h2>Export Quiz</h2>

<div>
  <label>Quiz ID:
    <input type="number" [(ngModel)]="quizId" placeholder="Enter Quiz ID" />
  </label>
  <button (click)="loadQuiz()">Load Quiz</button>
</div>

<div *ngIf="quizData">
  <h3>{{ quizData.quiz.title }}</h3>
  <p><strong>Category:</strong> {{ quizData.category.name }}</p>
  <p><strong>Questions:</strong> {{ quizData.questions.length }}</p>

  <div class="export-sidebar">
    <h3>Export Preview (JSON)</h3>
    <pre>{{ quizData | json }}</pre>
  </div>

  <button (click)="exportToJson()">Export as JSON</button>
</div>
