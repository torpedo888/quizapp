<div class="quiz-page">

  <div class="quiz-card">
    
    <div class="quiz-toolbar">
      <span class="quiz-eyebrow">Quiz challenge</span>
      <button (click)="toggleSound()" class="btn btn-light sound-toggle-btn" title="Toggle sound" [attr.aria-label]="isSoundEnabled ? 'Mute sound' : 'Enable sound'" [attr.aria-pressed]="isSoundEnabled">
        <i [class]="soundService.isSoundEnabled ? 'fa fa-volume-up' : 'fa fa-volume-mute'"></i>
      </button>
      
    </div>

    <div>
      <app-quiz-timer 
      [totalTime]="3"
      [currentQuestion]="currentQuestionIndex + 1"
      [totalQuestions]="questions.length"
      [score]="userScore"
      [pointsPerQuestion]="pointsPerQuestion"
      (timeExpired)="onTimeUp()">
    </app-quiz-timer>
    </div>

    <!-- Question Image -->
    <div class="question-image" *ngIf="questions[currentQuestionIndex]?.imageUrl">
      <img *ngIf="questions[currentQuestionIndex]?.imageUrl" 
          [src]="questions[currentQuestionIndex]?.imageUrl" 
          alt="Question Image" 
          class="rounded mx-auto d-block"
 />
    </div>

    <!-- Question Text -->
    <h2 class="question-text">
      {{ questions[currentQuestionIndex]?.text }}
    </h2>

    <div class="quiz-options" role="group" aria-label="Answer choices">
      <div *ngFor="let option of questions[currentQuestionIndex]?.options" class="quiz-option">

        <!-- Wrap everything in a label for full clickability -->
        <label class="option-label"
          [for]="'option' + option.id"
          style="cursor: pointer;"
          [ngClass]="{
            'selected-option': selectedAnswers[questions[currentQuestionIndex].id] === option.id
          }">

          <input class="option-input"
              type="radio"
              name="question{{currentQuestionIndex}}"
              [value]="option.id"
              [checked]="selectedAnswers[questions[currentQuestionIndex].id] === option.id"
              (change)="selectOption(questions[currentQuestionIndex].id, option.id)"
              id="option{{ option.id }}"
              [attr.disabled]="answerSubmitted ? true : null">

          <span class="radio-circle" aria-hidden="true"></span>
          <span class="option-text">{{ option.text }}</span>

          <!-- Show checkmark if the user selected the correct answer -->
          <i *ngIf="answerSubmitted && selectedAnswers[questions[currentQuestionIndex].id] === option.id && option.isCorrect" 
            class="fa fa-check rounded-checkmark ms-3"></i>

          <!-- Show X if the user selected the wrong answer -->
          <i *ngIf="answerSubmitted && selectedAnswers[questions[currentQuestionIndex].id] === option.id && !option.isCorrect" 
            class="fa-solid fa-xmark rounded-xmark ms-3"></i>

          <!-- Highlight the correct answer even if the user got it wrong -->
          <i *ngIf="answerSubmitted && option.isCorrect && selectedAnswers[questions[currentQuestionIndex].id] !== option.id" 
            class="fa-solid fa-check rounded-checkmark ms-3"></i>
        </label>

      </div>
    </div>

    <!-- Submit Button -->
    <button class="btn btn-light quiz-action"
        (click)="submitCurrentAnswer()"
        *ngIf="!answerSubmitted">
        Submit
    </button>

    <!-- Next Button -->
    <button class="btn btn-primary quiz-action"
        (click)="nextQuestion()"
        *ngIf="answerSubmitted">
        Next
    </button>

    <!-- Validation Message -->
    <div *ngIf="errorMessage" class="text-danger mt-2">
    {{ errorMessage }}
    </div>

    
</div>

</div>
