<div class="container mt-4">
  <h2 class="text-center">Quizzes2</h2>
  <div class="row justify-content-center">
    <div class="col-md-4" *ngFor="let quiz of quizzes">
      <div
        class="card quiz-card mb-4 cursor-pointer">
        <img
          [src]="quiz.imageUrl"
          class="card-img-top quiz-img"
          alt="quiz.title"
        >
        <div class="card-body">
          <h5 class="card-title">{{ quiz.title }}</h5>
          <div class="btn btn-primary">Start Quiz</div>
        </div>
      </div>
    </div>
  </div>
</div>
