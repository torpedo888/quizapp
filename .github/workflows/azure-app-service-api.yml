name: Deploy API to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "API/**"
      - ".github/workflows/azure-app-service-api.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore API/API.csproj

      - name: Build
        run: dotnet build API/API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish API/API.csproj --configuration Release --output ./publish --no-build

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: frankquiz-d6hcdqgbctacf6dh
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
